<h1>Plasma Studio testing builds</h1>
<p>Install once:</p>
<pre>flatpak install --from https://nicco.love/plasma-studio-flatpak/plasmastudio.flatpakrepo</pre>
<p>Then <code>flatpak run love.nicco.plasmastudio</code>; later builds arrive with <code>flatpak update</code>.</p>
<p>A project file is a program: open only projects you made or trust.</p>
